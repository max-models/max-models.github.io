name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # The newest release, not the runner's cached one: Astro raises its minimum often.
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # the pages must answer once deployed (an empty or missing site is a 404)
      - name: Check the deployed site
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --output /dev/null \
            --retry 12 --retry-delay 10 --retry-all-errors "${URL%/}/index.html"
