name: Docs

# The Astro + Starlight site in docs/, built on every push and pull request with the shared
# workflow of max-models/starlight-theme; deployed to GitHub Pages (at the root) from main.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@no-python-and-user-sites
    with:
      notebooks: false
      deploy-branch: main
